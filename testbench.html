<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试台 — 星球漫游者</title>
  <style>
    body { overflow: hidden; }
    #tb-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #2a3550 0%, #1a2233 55%, #121a28 100%); }
    #tb-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; gap: 8px; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; font-size: 13px; color: var(--txt); }
    #tb-bar .tab { padding: 5px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 13px; }
    #tb-bar .tab.on { border-color: var(--acc); color: var(--acc); }
    #tb-bar .act { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 12px; }
    #tb-bar .act:hover { border-color: var(--acc); }
    #tb-list { position: fixed; top: 46px; left: 0; bottom: 0; z-index: 50; width: 220px; background: var(--panel); border-right: 1px solid var(--line); padding: 10px; overflow-y: auto; }
    #tb-list .it { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; padding: 4px 7px; margin: 2px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--txt); cursor: pointer; font-size: 12px; }
    #tb-list .it:hover { border-color: var(--acc); }
    #tb-list .it.on { border-color: var(--acc); color: var(--acc); }
    #tb-list .it img { width: 26px; height: 26px; }
    #tb-hint { position: fixed; bottom: 12px; left: 240px; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 14px; font-size: 12px; color: var(--dim); }
    #tb-side { position: fixed; right: 12px; top: 56px; z-index: 50; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--txt); }
    #tb-side h3 { color: var(--acc); font-size: 13px; margin: 0 0 8px; }
    #tb-side .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    #tb-side .row span { width: 64px; color: var(--dim); }
    #tb-side input[type=range] { flex: 1; }
    #tb-side .clips button { margin: 2px 3px 2px 0; padding: 3px 9px; font-size: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--txt); cursor: pointer; }
    #tb-side .clips button.on { border-color: var(--acc); color: var(--acc); }
    #tb-json { position: fixed; right: 12px; bottom: 12px; z-index: 50; width: 300px; height: 130px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--dim); font-size: 10px; font-family: monospace; padding: 6px; resize: none; }
    /* 任务看板(设计版) */
    #tb-quest { position: fixed; top: 46px; left: 220px; right: 0; bottom: 0; z-index: 40; background: #f5ecda; display: flex; flex-direction: column; }
    #tq-toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    #tq-toolbar .act { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 12px; }
    #tq-toolbar .act:hover { border-color: var(--acc); }
    #tq-msg { font-size: 12px; color: var(--dim); }
    #tq-board { flex: 1; overflow: auto; padding: 10px; }
    .tq-err { color: var(--red); font-size: 12px; padding: 8px; }
    #tq-form { position: absolute; right: 0; top: 38px; bottom: 0; width: 300px; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--txt); z-index: 6; }
    #tq-form h3 { color: var(--acc); font-size: 13px; margin: 0; }
    #tq-form label { display: flex; flex-direction: column; gap: 2px; color: var(--dim); }
    #tq-form input, #tq-form select, #tq-form textarea { padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--txt); font-size: 12px; font-family: inherit; }
    #tq-form .frow { display: flex; gap: 8px; }
    #tq-form .frow label { flex: 1; }
    #tq-form button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 12px; }
    #tb-quest.hidden, #tq-form.hidden { display: none; }
    /* 地图设计模式 */
    #tb-map { position: fixed; top: 46px; left: 220px; right: 0; bottom: 0; z-index: 40; background: #2a3550; display: flex; flex-direction: column; }
    #tm-toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--txt); }
    #tm-toolbar .act { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 12px; }
    #tm-toolbar select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--txt); font-size: 12px; }
    #tm-msg { font-size: 12px; color: var(--dim); }
    #tm-msg.err { color: var(--red); }
    #tm-canvas { flex: 1; width: 100%; cursor: grab; }
    #tb-map.hidden { display: none; }
  </style>
  <script type="module" crossorigin src="./assets/testbench-C559zyEq.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/buildings-C1PFg7Hp.js">
  <link rel="modulepreload" crossorigin href="./assets/questgraph-s-oqvwHy.js">
  <link rel="stylesheet" crossorigin href="./assets/buildings-BJbKXvUP.css">
</head>
<body>
  <canvas id="tb-canvas"></canvas>
  <div id="tb-bar">
    <b style="color:var(--acc)">🧪 测试台</b>
    <button class="tab on" data-m="build">🧱 建筑拼装</button>
    <button class="tab" data-m="creature">🐾 生物动作</button>
    <button class="tab" data-m="quest">📋 任务看板</button>
    <button class="tab" data-m="map">🗺 地图设计</button>
    <span style="flex:1"></span>
    <button class="act" id="tb-export">导出 JSON</button>
    <button class="act" id="tb-import">导入</button>
    <button class="act" id="tb-clear">清空</button>
  </div>
  <div id="tb-list"></div>
  <div id="tb-quest" class="hidden">
    <div id="tq-toolbar">
      <button class="act" id="tq-add">新建任务</button>
      <button class="act" id="tq-addch">新建章节</button>
      <button class="act" id="tq-save">保存到文件</button>
      <span id="tq-msg"></span>
    </div>
    <div id="tq-board"></div>
    <div id="tq-form" class="hidden"></div>
  </div>
  <div id="tb-map" class="hidden">
    <div id="tm-toolbar">
      <label>星球 <select id="tm-planet"></select></label>
      <button class="act" id="tm-fit">适配区域</button>
      <button class="act" id="tm-check">边界/出口检查</button>
      <span id="tm-msg"></span>
    </div>
    <canvas id="tm-canvas"></canvas>
  </div>
  <div id="tb-side" class="hidden"></div>
  <div id="tb-hint"></div>
  <textarea id="tb-json" class="hidden" placeholder="预设 JSON（导出/导入用）"></textarea>
</body>
</html>
