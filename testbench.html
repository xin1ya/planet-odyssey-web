<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试台 — 星球漫游者</title>
  <style>
    body { overflow: hidden; }
    #tb-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #2a3550 0%, #1a2233 55%, #121a28 100%); }
    #tb-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; gap: 8px; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; font-size: 13px; color: var(--txt); }
    #tb-bar .tab { padding: 5px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 13px; }
    #tb-bar .tab.on { border-color: var(--acc); color: var(--acc); }
    #tb-bar .act { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; font-size: 12px; }
    #tb-bar .act:hover { border-color: var(--acc); }
    #tb-list { position: fixed; top: 46px; left: 0; bottom: 0; z-index: 50; width: 220px; background: var(--panel); border-right: 1px solid var(--line); padding: 10px; overflow-y: auto; }
    #tb-list .it { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; padding: 4px 7px; margin: 2px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--txt); cursor: pointer; font-size: 12px; }
    #tb-list .it:hover { border-color: var(--acc); }
    #tb-list .it.on { border-color: var(--acc); color: var(--acc); }
    #tb-list .it img { width: 26px; height: 26px; }
    #tb-hint { position: fixed; bottom: 12px; left: 240px; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 14px; font-size: 12px; color: var(--dim); }
    #tb-side { position: fixed; right: 12px; top: 56px; z-index: 50; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--txt); }
    #tb-side h3 { color: var(--acc); font-size: 13px; margin: 0 0 8px; }
    #tb-side .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    #tb-side .row span { width: 64px; color: var(--dim); }
    #tb-side input[type=range] { flex: 1; }
    #tb-side .clips button { margin: 2px 3px 2px 0; padding: 3px 9px; font-size: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--txt); cursor: pointer; }
    #tb-side .clips button.on { border-color: var(--acc); color: var(--acc); }
    #tb-json { position: fixed; right: 12px; bottom: 12px; z-index: 50; width: 300px; height: 130px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--dim); font-size: 10px; font-family: monospace; padding: 6px; resize: none; }
  </style>
  <script type="module" crossorigin src="./assets/testbench-kCnCSQRk.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/buildings-C1PFg7Hp.js">
  <link rel="stylesheet" crossorigin href="./assets/buildings-BJbKXvUP.css">
</head>
<body>
  <canvas id="tb-canvas"></canvas>
  <div id="tb-bar">
    <b style="color:var(--acc)">🧪 测试台</b>
    <button class="tab on" data-m="build">🧱 建筑拼装</button>
    <button class="tab" data-m="creature">🐾 生物动作</button>
    <span style="flex:1"></span>
    <button class="act" id="tb-export">导出 JSON</button>
    <button class="act" id="tb-import">导入</button>
    <button class="act" id="tb-clear">清空</button>
  </div>
  <div id="tb-list"></div>
  <div id="tb-side" class="hidden"></div>
  <div id="tb-hint"></div>
  <textarea id="tb-json" class="hidden" placeholder="预设 JSON（导出/导入用）"></textarea>
</body>
</html>
